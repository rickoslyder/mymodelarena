name: ArenaLab CI

on:
  push:
    branches: [main, "arenalab/**"]
    paths:
      - "arenalab/**"
      - ".github/workflows/arenalab-ci.yml"
  pull_request:
    paths:
      - "arenalab/**"
      - ".github/workflows/arenalab-ci.yml"

concurrency:
  group: arenalab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: arenalab
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arenalab/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run soak -- 250
